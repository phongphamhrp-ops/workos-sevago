<style>
:root{--navy:#13294B;--navy-2:#1E3A5F;--navy-3:#2B4C7E;--gold:#C9A227;--gold-2:#F4E7B8;--bg:#F4F6F9;--surface:#FFF;--surface-2:#F8FAFC;--line:#E3E8EF;--line-2:#EEF2F6;--text:#0F172A;--text-2:#334155;--muted:#64748B;--muted-2:#94A3B8;--ok:#059669;--ok-bg:#ECFDF5;--warn:#B45309;--warn-bg:#FFFBEB;--bad:#DC2626;--bad-bg:#FEF2F2;--info:#2563EB;--info-bg:#EFF6FF;--radius:12px;--shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);--shadow-lg:0 20px 40px -12px rgba(15,23,42,.25);--side:236px}

   h+='<div class="sec-t">Phụ thuộc</div>'+(d.preds.length?'<div class="muted" style="font-size:12px;margin:4px 0">Phải xong trước:</div>'+d.preds.map(function(x){return '<div style="display:flex;gap:8px;align-items:center;padding:3px 0"><span class="badge">'+esc(x.type)+(Number(x.lag)?' +'+x.lag+'d':'')+'</span><a style="cursor:pointer" onclick="openTask(\''+esc(x.task)+'\')">'+esc(x.name)+'</a>'+(ed?'<button class="ib" onclick="depDel(\''+esc(x.id)+'\')">✕</button>':'')+'</div>'}).join(''):'')+(d.succs.length?'<div class="muted" style="font-size:12px;margin:6px 0 4px">Việc phụ thuộc vào việc này:</div>'+d.succs.map(function(x){return '<div style="padding:3px 0"><a style="cursor:pointer" onclick="openTask(\''+esc(x.task)+'\')">→ '+esc(x.name)+'</a></div>'}).join(''):'')+(!d.preds.length&&!d.succs.length?'<div class="muted" style="font-size:13px">Không có phụ thuộc.</div>':'')
   +(ed?'<div style="display:flex;gap:8px;margin-top:8px"><select class="inp" id="dp_t"><option value="">Chọn việc phải xong trước…</option>'+d.pool.map(function(x){return opt(x.id,x.wbs+' '+x.title,'')}).join('')+'</select><button class="btn" onclick="depAdd()">Thêm</button></div>':'')}
  // thời gian
  h+='<div class="sec-t">Ghi giờ</div>'+(d.time.length?d.time.map(function(x){return '<div class="muted" style="font-size:12.5px;padding:2px 0">'+fd(x.date)+' · '+esc(nm(x.user))+' · <b>'+esc(x.hours)+'h</b> '+esc(x.note)+(x.user===B.me.email||d.canManage||B.me.rank>=90?' <a style="cursor:pointer;color:var(--bad,#b91c1c)" onclick="tlDel(\''+esc(x.id)+'\')">✕</a>':'')+'</div>'}).join(''):'<div class="muted" style="font-size:13px">Chưa có giờ làm.</div>')+(ed?'<div style="display:flex;gap:8px;margin-top:8px"><input class="inp" id="tl_h" type="number" min="0" step="0.5" placeholder="Giờ" style="width:90px"><input class="inp" id="tl_n" placeholder="Ghi chú"><button class="btn" onclick="tlAdd()">Ghi</button></div>':'');
  h+='<div class="sec-t">Thảo luận</div>'+thread(d.discussion)+'<div class="field" style="margin-top:10px"><textarea class="inp" id="cb" rows="2" placeholder="Viết bình luận… (dùng @email để nhắc)"></textarea></div>'+(mgr&&pid?'<label style="display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px"><input type="checkbox" id="cv"> Chỉ nội bộ quản lý</label>':'')+'<p><button class="btn gold" onclick="sendC(\'Task\',\''+esc(t.id)+'\',function(){openTask(\''+esc(t.id)+'\')})">Gửi bình luận</button>'+(d.canDelete?' <button class="btn danger" style="float:right" onclick="taskDel()">Xóa việc</button>':'')+'</p></div>';
  openDr(h);if(ed){V.pp.t_asg.cb=function(){tf('assignees',ppGet('t_asg'))};V.pp.t_wat.cb=function(){tf('watchers',ppGet('t_wat'))};ppAll()}}
function lbTog(k){var l=String(V.td.task.labels||'').split(/[,;\s]+/).filter(String),i=l.indexOf(k);if(i>=0)l.splice(i,1);else l.push(k);V.td.task.labels=l.join(', ');tf('labels',l.join(', '),1)}
function ckAdd(){var v=$('#ck_n').value.trim();if(!v)return;api('addCheck',[V.td.task.id,v],function(){V.dirty=true;openTask(V.td.task.id)})}
function ckTog(i,on){api('toggleCheck',[i,!!on],function(){V.dirty=true;openTask(V.td.task.id)})}
function ckDel(i){api('delCheck',[i],function(){V.dirty=true;openTask(V.td.task.id)})}
function subAdd(){var v=$('#sub_n').value.trim();if(!v)return;api('saveTask',[{title:v,project_id:V.td.task.pid,parent:V.td.task.id,assignees:V.td.task.assignees}],function(){V.dirty=true;openTask(V.td.task.id)})}
function depAdd(){var v=$('#dp_t').value;if(!v){toast('Chọn việc.',1);return}api('saveDep',[V.td.task.id,v,'FS',0],function(){V.dirty=true;openTask(V.td.task.id)})}
function depDel(i){api('delDep',[i],function(){V.dirty=true;openTask(V.td.task.id)})}
function tlAdd(){var h=$('#tl_h').value;api('logTime',[V.td.task.id,h,$('#tl_n').value,''],function(){V.dirty=true;toast('Đã ghi giờ');openTask(V.td.task.id)})}
function taskDel(){var t=V.td.task;ask('Xóa công việc','Xóa <b>'+esc(t.title)+'</b> và mọi việc con? Dữ liệu được đánh dấu xóa, quản trị có thể khôi phục trong file.','Xóa',function(){api('deleteTask',[t.id],function(r){toast('Đã xóa '+r.n+' việc');V.dirty=true;closeDr()})},null,true)}
</script>
<script>
/* ===== Dự án ===== */
function vnd(n){n=Number(n)||0;return n.toLocaleString('vi-VN')+' ₫'}
V.pj={q:'',st:'',mode:'card'};V.pt='ov';V.cp={};
function vProj(){if(V.pid){openProj(V.pid);return}api('getProjects',[],function(ps){V.pl=ps;drawPL()})}
function drawPL(){var pj=V.pj,q=pj.q.toLowerCase(),l=V.pl.filter(function(p){return (!pj.st||p.status===pj.st)&&(!q||(p.name+' '+p.id+' '+nm(p.pm)).toLowerCase().indexOf(q)>=0)});
  var h='<div class="bar"><input class="inp" style="width:240px" placeholder="Tìm dự án…" value="'+esc(pj.q)+'" oninput="V.pj.q=this.value;V.pq=1;clearTimeout(V.pw);V.pw=setTimeout(drawPL,250)"><select class="inp" style="width:170px" onchange="V.pj.st=this.value;drawPL()">'+catOpts('PROJSTATUS',pj.st,'Mọi trạng thái')+'</select><div class="chips">'+[['card','▦ Thẻ'],['table','☰ Bảng']].map(function(x){return '<button class="chip'+(pj.mode===x[0]?' on':'')+'" onclick="V.pj.mode=\''+x[0]+'\';drawPL()">'+x[1]+'</button>'}).join('')+'</div><span class="grow"></span>'+((can('PROJECT.CREATE')||B.me.rank>=60)?'<button class="btn gold" onclick="projForm()">+ Dự án mới</button>':'')+'</div>';
  if(!l.length)h+=empty('Chưa có dự án','Tạo dự án mới hoặc liên hệ quản lý để được thêm vào dự án.');
  else if(pj.mode==='card')h+='<div class="grid g3">'+l.map(projCard).join('')+'</div>';
  else h+='<div class="card tbl-wrap"><table class="t"><thead><tr><th>Dự án</th><th>PM</th><th>Trạng thái</th><th>Tiến độ</th><th>Thời gian</th><th>Việc mở</th><th>Trễ</th><th>Rủi ro</th><th>RAG</th></tr></thead><tbody>'+l.map(function(p){return '<tr style="cursor:pointer" onclick="openProj(\''+esc(p.id)+'\')"><td><div class="main-c">'+esc(p.name)+'</div><div class="sub-c">'+esc(p.id)+'</div></td><td>'+esc(nm(p.pm))+'</td><td>'+badge(p.status)+'</td><td style="min-width:120px">'+prog(p.pct)+'<div class="sub-c">'+esc(p.pct)+'% / '+esc(p.planned)+'%</div></td><td>'+fd(p.start)+' → '+fd(p.end)+'</td><td>'+esc(p.open)+'</td><td>'+(Number(p.overdue)?'<b style="color:var(--bad)">'+esc(p.overdue)+'</b>':'0')+'</td><td>'+esc(p.risks)+'</td><td>'+ragB(p.rag)+'</td></tr>'}).join('')+'</tbody></table></div>';
  $('#view').innerHTML=h;if(V.pq){var i=document.querySelector('.bar input.inp');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}V.pq=0}}
function projFields(p){p=p||{};return '<div class="grid g2">'+F('Tên dự án *','<input class="inp" id="p_n" value="'+esc(p.name||'')+'">','span2')
  +F('Loại','<select class="inp" id="p_ty">'+['Dự án','Chiến dịch','Cải tiến','Vận hành'].map(function(x){return opt(x,x,p.type||'Dự án')}).join('')+'</select>')+F('Trạng thái','<select class="inp" id="p_st">'+catOpts('PROJSTATUS',p.status||'PROJSTATUS.ACTIVE')+'</select>')
  +F('Quản lý dự án (PM)',pp('p_pm',[p.pm||B.me.email],false))+F('Nhà tài trợ',pp('p_sp',p.sponsor?[p.sponsor]:[],false))
  +F('Phòng ban','<select class="inp" id="p_dp">'+deptOpts(p.dept||B.me.dept,'— Chọn —')+'</select>')+F('Ưu tiên','<select class="inp" id="p_pr">'+catOpts('PRIORITY',p.pri||'PRIORITY.MED')+'</select>')
  +F('Bắt đầu','<input class="inp" type="date" id="p_s" value="'+dts(p.start||ymd(new Date()))+'">')+F('Kết thúc','<input class="inp" type="date" id="p_e" value="'+dts(p.end)+'">')
  +F('Ngân sách (₫)','<input class="inp" type="number" min="0" step="1000000" id="p_b" value="'+esc(p.budget||'')+'">','span2')+F('Mô tả','<textarea class="inp" id="p_d" rows="3">'+esc(p.desc||'')+'</textarea>','span2')+'</div>'}
function projCollect(id){return {id:id||'',name:val('p_n'),type:val('p_ty'),status:val('p_st'),pm:ppGet('p_pm'),sponsor:ppGet('p_sp'),dept:val('p_dp'),pri:val('p_pr'),start:val('p_s'),end:val('p_e'),budget:val('p_b'),desc:val('p_d')}}
function projForm(){openM('<div class="m-h"><h2>Dự án mới</h2><button class="btn sm ghost" onclick="closeM()">Đóng</button></div><div class="m-b">'+projFields()+'<div class="grid g2" style="margin-top:12px">'+F('Tạo từ mẫu (tùy chọn)','<select class="inp" id="p_tp">'+opt('','— Dự án trống —','')+(B.templates||[]).map(function(t){return opt(t.id,t.name,'')}).join('')+'</select>','span2')+'</div></div><div class="m-f"><button class="btn" onclick="closeM()">Hủy</button><button class="btn pri" id="p_ok" onclick="projCreate()">Tạo dự án</button></div>');ppAll();$('#p_n').focus()}
function projCreate(){var p=projCollect('');p.template=val('p_tp');var b=$('#p_ok');b.disabled=true;api('saveProject',[p],function(r){closeM();toast('Đã tạo '+r.id+(r.tplError?' (mẫu lỗi: '+r.tplError+')':''));api('getBoot',[],function(nb){B=nb;V.pid=r.id;V.pt='ov';go('proj')})},function(m){b.disabled=false;toast(m,1)})}
function openProj(id){if(V.pid!==id)V.pt='ov';V.pid=id;view='proj';api('getProjectFull',[id],function(d){V.pd=d;if($('#ttl')){$('#ttl').textContent=d.project.name||'Dự án';$('#sub').textContent=id;document.querySelectorAll('.nav button').forEach(function(b){b.className=b.dataset.v==='proj'?'on':''})}drawProj()},function(m){toast(m,1);V.pid='';go('proj')})}
function tsort(a,b){return String(a.wbs).localeCompare(String(b.wbs),undefined,{numeric:true})}
function drawProj(){var d=V.pd,p=d.project,mg=d.canManage,t=V.pt,ed=d.role&&d.role!=='VIEWER';
  var tabs=[['ov','Tổng quan'],['grid','Danh sách ('+d.tasks.length+')'],['board','Bảng'],['gantt','Tiến độ (Gantt)'],['ms','Mốc & rủi ro'],['team','Thành viên ('+d.members.length+')'],['disc','Thảo luận'],['time','Giờ công']].concat(mg?[['set','Cài đặt']]:[]);
  var h='<div class="pg-h"><button class="btn" onclick="V.pid=\'\';go(\'proj\')">← Dự án</button><div style="flex:1;min-width:200px"><h2>'+esc(p.name)+' '+badge(p.status)+' '+ragB(p.rag)+'</h2><div class="muted" style="font-size:13px">'+esc(p.id)+' · PM '+esc(nm(p.pm))+' · '+fd(p.start)+' → '+fd(p.end)+' · '+badge(p.pri)+'</div></div><div style="min-width:200px;width:260px">'+prog(p.pct)+'<div class="muted" style="font-size:12px;margin-top:4px">Hoàn thành '+esc(p.pct)+'% · kế hoạch '+esc(p.planned)+'%</div></div>'+(ed?'<button class="btn gold" onclick="taskForm({project_id:\''+esc(p.id)+'\'})">+ Việc</button>':'')+'</div>';
  h+='<div class="pgt">'+tabs.map(function(x){return '<button class="'+(t===x[0]?'on':'')+'" onclick="V.pt=\''+x[0]+'\';drawProj()">'+x[1]+'</button>'}).join('')+'</div>';
  V.gredraw=drawProj;
  if(t==='ov')h+=projOv(d);else if(t==='grid')h+=projGrid(d,ed);else if(t==='board')h+=board(d.tasks.slice().sort(tsort),{add:ed,pid:p.id});
  else if(t==='gantt')h+='<div class="bar">'+ganttScaleBtns()+'<span class="muted" style="font-size:12px">Kéo thanh để đổi lịch, kéo mép phải để đổi hạn. Mũi tên: phụ thuộc.</span></div>'+gantt(d.tasks.slice().sort(tsort),{deps:d.deps,ms:d.milestones});
  else if(t==='ms')h+=projMs(d);else if(t==='team')h+=projTeam(d);else if(t==='time')h+=projTime(d);
  else if(t==='disc')h+='<div class="card card-b">'+thread(d.discussion)+'<div class="field" style="margin-top:10px"><textarea class="inp" id="cb" rows="3" placeholder="Viết bình luận…"></textarea></div>'+(mg?'<label style="display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px"><input type="checkbox" id="cv"> Chỉ nội bộ quản lý</label>':'')+'<p><button class="btn gold" onclick="sendC(\'Project\',\''+esc(p.id)+'\',function(){openProj(\''+esc(p.id)+'\')})">Gửi bình luận</button></p></div>';
  else if(t==='set')h+='<div class="card card-b">'+projFields(p)+'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" onclick="projSave()">Lưu thay đổi</button>'+(V.pd.canDelete?'<button class="btn danger" style="margin-left:auto" onclick="projDel()">Xóa dự án</button>':'')+'</div></div>';
  $('#view').innerHTML=h;if(t==='gantt')ganttBind();if(t==='set')ppAll()}
function projSave(){api('saveProject',[projCollect(V.pid)],function(){toast('Đã lưu dự án');api('getBoot',[],function(nb){B=nb;openProj(V.pid)})})}
function projDel(){ask('Xóa dự án','Xóa <b>'+esc(V.pd.project.name)+'</b>? Dự án chuyển sang trạng thái Hủy và ẩn khỏi danh sách.','Xóa dự án',function(){api('deleteProject',[V.pid],function(){toast('Đã xóa dự án');V.pid='';api('getBoot',[],function(nb){B=nb;go('proj')})})},null,true)}
function projOv(d){var p=d.project,T=d.tasks,cnt={},open=0,over=0,td=ymd(new Date());T.forEach(function(t){cnt[t.status]=(cnt[t.status]||0)+1;var fin=t.status==='TASKSTATUS.DONE'||t.status==='TASKSTATUS.CANCEL';if(!fin){open++;if(t.due&&dts(t.due)<td)over++}});
  var days=p.end?dd2(td,dts(p.end)):null;
  var h='<div class="stat">'+[['Tiến độ',(p.pct||0)+'%','kế hoạch '+(p.planned||0)+'%'],['Tổng việc',T.length,open+' đang mở'],['Quá hạn',over,over?'cần xử lý':'đúng tiến độ'],['Rủi ro mở',d.risks.filter(function(r){return !/Đã đóng|Đã xử lý/.test(r.status)}).length,'đang theo dõi'],['Ngân sách',vnd(p.budget),''],['Còn lại',days===null?'—':(days<0?'quá '+(-days)+' ngày':days+' ngày'),'đến '+fd(p.end)]].map(function(x,i){return '<div class="card"><div class="l">'+x[0]+'</div><div class="v"'+(i===2&&over?' style="color:var(--bad)"':'')+'>'+x[1]+'</div><div class="muted" style="font-size:11.5px">'+x[2]+'</div></div>'}).join('')+'</div>';
  var tot=T.length||1;h+='<div class="card card-b"><b style="font-size:13px">Phân bổ trạng thái</b><div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0">'+BOARD.concat(['TASKSTATUS.CANCEL']).map(function(s){return cnt[s]?'<span title="'+esc(cn(s))+': '+cnt[s]+'" style="width:'+(100*cnt[s]/tot)+'%;background:'+TS[s]+'"></span>':''}).join('')+'</div><div class="chips">'+BOARD.map(function(s){return '<span class="muted" style="font-size:12px">'+stDot(s)+' '+esc(cn(s))+' <b>'+(cnt[s]||0)+'</b></span>'}).join(' &nbsp; ')+'</div></div>';
  h+='<div class="grid g2" style="margin-top:14px"><div class="card card-b"><b style="font-size:13px">Mô tả</b><p style="white-space:pre-wrap;margin:8px 0 0">'+esc(p.desc||'Chưa có mô tả.')+'</p></div><div class="card card-b"><b style="font-size:13px">Mốc sắp tới</b>'+(d.milestones.filter(function(m){return m.status!=='Đạt'}).slice(0,5).map(function(m){return '<div class="task" style="cursor:default"><div class="grow"><div class="t1">◆ '+esc(m.name)+'</div><div class="t2">Hạn '+fd(m.due_planned)+' · '+esc(nm(m.owner_email))+'</div>'+prog(m.pct_complete)+'</div></div>'}).join('')||'<div class="muted" style="margin-top:8px">Không có mốc.</div>')+'</div></div>';return h}
function projGrid(d,ed){var T=d.tasks.slice().sort(tsort),kids={};T.forEach(function(t){if(t.parent)kids[t.parent]=1});
  var hid={};var rows=T.filter(function(t){var p=t.parent,x=t.parent;while(x){if(V.cp[x])return false;var pt=T.filter(function(y){return y.id===x})[0];x=pt?pt.parent:''}return true});
  var cols='56px minmax(200px,1fr) 120px 112px 112px 64px 124px';
  var h='<div class="card" style="overflow:auto"><div style="min-width:860px"><div class="tr h" style="grid-template-columns:'+cols+'"><span>WBS</span><span>Công việc</span><span>Người thực hiện</span><span>Bắt đầu</span><span>Hạn</span><span>%</span><span>Trạng thái</span></div>';
  h+=rows.map(function(t){var dep=Math.max(0,String(t.wbs).split('.').length-1),k=kids[t.id],fin=t.status==='TASKSTATUS.DONE';

<script>
/* ===== Lịch kiểu Google Calendar ===== */
var DOW=['CN','T2','T3','T4','T5','T6','T7'],HH=48;
function tm(d){return p2(d.getHours())+':'+p2(d.getMinutes())}
function ymdh(d){return ymd(d)+' '+tm(d)}
function dlocal(d){return ymd(d)+'T'+tm(d)}
function mon(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function ad(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes());x.setDate(x.getDate()+n);return x}
function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
V.c={view:'week',d:ymd(new Date()),mini:ymd(new Date()),lay:{mine:1,oth:1,due:1,hol:1,busy:0}};V.cdata=null;
function cr(){var c=V.c,d=D(c.d),a,b;if(c.view==='day'){a=d;b=ad(d,1)}else if(c.view==='week'){a=mon(d);b=ad(a,7)}else if(c.view==='month'){a=mon(new Date(d.getFullYear(),d.getMonth(),1));b=ad(a,42)}else{a=d;b=ad(d,31)}return [a,b]}
function vCal(){loadCal()}
function loadCal(){var r=cr(),k=ymd(r[0])+'|'+ymd(r[1]);api('getCalendarFull',[ymd(r[0])+' 00:00',ymd(r[1])+' 23:59'],function(d){V.cdata=d;V.ck=k;drawCal()})}
function calNorm(){var d=V.cdata,E=[];d.events.forEach(function(x){var s=P(x.start),e=P(x.end);if(!s||!e||isNaN(s))return;var mine=x.own||has(x.att,B.me.email)||String(x.org).toLowerCase()===B.me.email;E.push({id:x.id,t:x.title,s:s,e:e,ad:x.allDay==='TRUE'||(e-s)>=23*36e5,st:x.status,type:x.type,room:x.room,mine:mine,x:x})});return E}
function dayItems(dstr,E){var c=V.c,d=V.cdata,out=[];
  E.filter(function(e){return e.ad&&ymd(e.s)<=dstr&&dstr<=ymd(new Date(e.e-1))&&(e.mine?c.lay.mine:c.lay.oth)}).forEach(function(e){out.push({t:e.t,col:ccol(e.type),f:'evView(\''+e.id+'\')',pend:e.st!=='Đã xác nhận'})});

function cnav(n){var c=V.c,d=D(c.d);if(n===0)d=new Date();else if(c.view==='day')d=ad(d,n);else if(c.view==='week')d=ad(d,7*n);else if(c.view==='month')d=new Date(d.getFullYear(),d.getMonth()+n,1);else d=ad(d,30*n);c.d=ymd(d);c.mini=ymd(d);loadCal()}

  var sw=V.c.view==='week'?ymd(mon(D(sel))):'';
  for(i=0;i<6;i++){h+='<tr>';for(j=0;j<7;j++){d=ad(f,i*7+j);var k=ymd(d),cl=(d.getMonth()!==mo?'o ':'')+(k===td?'t ':'')+((V.c.view==='day'&&k===sel)||(V.c.view==='week'&&ymd(mon(d))===sw)?'s':'');h+='<td class="'+cl+'"><span onclick="V.c.d=\''+k+'\';V.c.mini=\''+k+'\';loadCal()">'+d.getDate()+'</span></td>'}h+='</tr>'}

function drawCal(){var c=V.c,E=calNorm(),h='<div class="cal"><div class="cal-side"><button class="btn gold" style="width:100%;justify-content:center;margin-bottom:12px" onclick="evForm()">+ Tạo sự kiện</button><div class="card" style="padding:12px;margin-bottom:12px">'+miniCal()+'</div><div class="card" style="padding:10px 12px"><div style="font-weight:600;font-size:13px;margin-bottom:4px">Hiển thị</div>'+layers()+'</div><div class="card" style="padding:10px 12px;margin-top:12px"><div style="font-weight:600;font-size:13px;margin-bottom:6px">Loại sự kiện</div>'+Object.keys(B.cats).filter(function(k){return B.cats[k].t==='EVENTTYPE'}).map(function(k){return '<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0"><i style="width:10px;height:10px;border-radius:3px;background:'+ccol(k)+'"></i>'+esc(cn(k))+'</div>'}).join('')+'</div></div><div class="cal-main">';
  h+='<div class="cal-tb"><button class="btn" onclick="cnav(0)">Hôm nay</button><button class="ib" style="font-size:20px" onclick="cnav(-1)">‹</button><button class="ib" style="font-size:20px" onclick="cnav(1)">›</button><h2>'+calTitle()+'</h2><span class="grow" style="flex:1"></span><div class="chips">'+[['day','Ngày'],['week','Tuần'],['month','Tháng'],['agenda','Lịch trình']].map(function(x){return '<button class="chip'+(c.view===x[0]?' on':'')+'" onclick="V.c.view=\''+x[0]+'\';loadCal()">'+x[1]+'</button>'}).join('')+'</div></div>';
  h+=c.view==='month'?calMonth(E):c.view==='agenda'?calAgenda(E):calTime(E);

function api(fn,args,ok,bad,quiet){
  args=args||[];var rd=!!PRD[fn],key=rd?fn+'|'+JSON.stringify(args):'',L={ok:ok||noop,bad:bad,nv:V.nav,ss:null,q:!!quiet},wv=V.wv,ent=null;
  if(rd){ent=V.ac[key];if(!ent&&!V.noP){var pl=pload(key);if(pl)ent=V.ac[key]={t:pl.t,d:pl.d,s:pl.s,p:1}}}

 var h='<div class="card" id="ins" style="margin-bottom:14px"><div class="card-h"><h3>✨ Gợi ý thông minh</h3><span class="muted" style="font-size:12px">Tự động phân tích việc, dự án, lịch và tải công việc</span></div><div class="card-b">'+a.map(function(x){return '<div class="ii '+x.sev+'" '+(x.go?'onclick="actGo(\''+esc(x.go)+'\')"':'style="cursor:default"')+'><span class="ic">'+x.icon+'</span><div><b>'+esc(x.title)+'</b><span class="d">'+esc(x.detail)+'</span></div></div>'}).join('')+'</div></div>';
 v.insertAdjacentHTML('afterbegin',h)}

var P_={on:0,items:[],sel:0};
function ensP(){if($('#pal'))return;var d=document.createElement('div');d.id='pal';d.onclick=function(e){if(e.target===d)palX()};d.innerHTML='<div class="pb"><input id="pal_q" placeholder="Tìm việc, dự án, hoặc gõ lệnh… (Esc để đóng)" autocomplete="off"><div class="pl" id="pal_l"></div></div>';document.body.appendChild(d);
 var q=$('#pal_q');q.oninput=function(){P_.sel=0;palR()};q.onkeydown=function(e){if(e.key==='ArrowDown'){P_.sel=Math.min(P_.sel+1,P_.items.length-1);palR(1);e.preventDefault()}else if(e.key==='ArrowUp'){P_.sel=Math.max(P_.sel-1,0);palR(1);e.preventDefault()}else if(e.key==='Enter'){palGo(P_.sel)}else if(e.key==='Escape')palX()}}
window.palX=function(){var p=$('#pal');if(p)p.classList.remove('show');P_.on=0};
window.pal=function(){ensP();$('#pal').classList.add('show');P_.on=1;var q=$('#pal_q');q.value='';P_.sel=0;q.focus();
 if(!P_.d){P_.d={t:[],p:[]};api('getMyTasks',[],function(t){P_.d.t=t;if(P_.on)palR()});api('getProjects',[],function(p){P_.d.p=p;if(P_.on)palR()})}palR()};

 Object.keys(TITLES).forEach(function(k){if($('#side')&&$('#side').textContent.indexOf(TITLES[k][0])>=0)c.push(['➜ Đi tới '+TITLES[k][0],"go('"+k+"')"])});return c}
function palR(keep){var q=nrm($('#pal_q').value.trim()),it=[],H='';
 function add(grp,list){if(!list.length)return;it.push({h:grp});list.forEach(function(x){it.push(x)})}
 var cs=cmds().filter(function(c){return !q||nrm(c[0]).indexOf(q)>=0}).slice(0,8).map(function(c){return {t:c[0],f:c[1]}});
 var ts=q?P_.d.t.filter(function(t){return nrm(t.title+' '+t.pname).indexOf(q)>=0}).slice(0,6).map(function(t){return {t:'✔ '+t.title,s:t.pname,f:"openTask('"+t.id+"')"}}):[];
 var ps=q?P_.d.p.filter(function(p){return nrm(p.name).indexOf(q)>=0}).slice(0,5).map(function(p){return {t:'📁 '+p.name,s:p.pct+'%',f:"openProj('"+p.id+"')"}}):[];
 add('Lệnh',cs);add('Công việc',ts);add('Dự án',ps);
 P_.items=it.filter(function(x){return !x.h});var n=-1;
 $('#pal_l').innerHTML=it.length?it.map(function(x){if(x.h)return '<div class="ph">'+x.h+'</div>';n++;return '<div class="pi'+(n===P_.sel?' on':'')+'" data-i="'+n+'" onclick="palGo('+n+')">'+esc(x.t)+(x.s?'<small>'+esc(x.s)+'</small>':'')+'</div>'}).join(''):'<div class="ph">Không có kết quả</div>';
 var on=$('#pal_l .on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'})}
window.palGo=function(i){var x=P_.items[i];if(!x)return;palX();try{closeM();closeDr()}catch(e){}setTimeout(function(){new Function(x.f)()},30)};
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){if(typeof B==='undefined'||!B||!B.me)return;e.preventDefault();pal()}});
})();
